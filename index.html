<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pericias Viales CABA - Redactor IA</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --success: #10b981;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding: 16px; }
    .container { max-width: 1150px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; }
    header h1 { font-size: 1.2rem; margin: 0; }
    header span { font-size: 0.85rem; color: var(--muted); }
    
    .api-bar { background: #172033; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; margin-bottom: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .api-bar input { flex: 1; min-width: 220px; padding: 8px 10px; font-size: 0.85rem; }
    .api-bar select { width: auto; padding: 8px 10px; font-size: 0.85rem; }
    .api-bar button { flex: 0 0 auto; padding: 8px 14px; font-size: 0.85rem; background: #334155; color: white; }
    .api-status { font-size: 0.8rem; color: var(--success); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .card h2 { font-size: 1rem; margin: 0; color: var(--accent); }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 10px; font-size: 0.95rem; }
    textarea { resize: vertical; min-height: 210px; line-height: 1.5; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-group { display: flex; gap: 10px; margin-top: 6px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-voice { background: #334155; color: white; }
    .btn-voice.recording { background: #ef4444; animation: pulse 1.2s infinite; }
    .btn-copy { background: var(--success); color: #064e3b; }
    
    .output-box { background: #ffffff; color: #111827; padding: 24px; border-radius: 6px; min-height: 490px; white-space: pre-wrap; font-family: "Times New Roman", Times, serif; font-size: 0.96rem; line-height: 1.48; overflow-y: auto; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Sección Investigación Científica Vial - CABA</h1>
      <span>Perito Actuante: OFL Mayor Lionel ZURITA (LP 11500)</span>
    </div>
    <span>Etapa 3 • Conexión Directa REST</span>
  </header>

  <div class="api-bar">
    <input type="password" id="apiKeyInput" placeholder="Pegá aquí tu API Key de Google AI Studio (AIzaSy...)">
    <select id="modeloSelect" title="Modelo Gemini">
      <option value="gemini-4-hydrogen">gemini-4-hydrogen</option>
      <option value="gemini-3-flash-preview">gemini-3-flash-preview</option>
      <option value="gemini-2.5-flash">gemini-2.5-flash</option>
    </select>
    <button type="button" onclick="guardarApiKey()">💾 Guardar</button>
    <span class="api-status" id="apiStatus"></span>
  </div>

  <div class="grid">
    <div class="card">
      <h2>1. Carga de Datos del Siniestro</h2>
      
      <div class="row-2">
        <div>
          <label>N° Informe Técnico</label>
          <input type="text" id="numInforme" placeholder="Ej: 7961">
        </div>
        <div>
          <label>Sumario / Actuaciones</label>
          <input type="text" id="sumario" placeholder="Ej: 720491 o N/A">
        </div>
      </div>

      <div class="row-2">
        <div>
          <label>Comisaría Vecinal</label>
          <input type="text" id="comisaria" placeholder="Ej: 12A">
        </div>
        <div>
          <label>Fiscalía (UFLA)</label>
          <select id="fiscalia">
            <option value="UFLA NORTE">UFLA NORTE</option>
            <option value="UFLA SUR">UFLA SUR</option>
            <option value="UFLA OESTE">UFLA OESTE</option>
            <option value="UFLA ESTE">UFLA ESTE</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div>
          <label>Carátula</label>
          <input type="text" id="caratula" value="LESIONES 94 CPN">
        </div>
        <div>
          <label>Hora de Arribo</label>
          <input type="time" id="horaArribo">
        </div>
      </div>

      <div>
        <label>Lugar del Hecho (CABA) y Efectivo de Consigna</label>
        <input type="text" id="lugarConsigna" placeholder="Ej: Gral. Paz Km 4.5 y Balbín - Ofl Mayor Carlos Escobar LP 42918">
      </div>

      <div>
        <label>Relato Crudo (Vehículos, Posición Final, Daños, Calzada y Rastros)</label>
        <textarea id="datosCrudos" placeholder="Escribí o dictá por voz todo junto..."></textarea>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-voice" id="btnVoz" onclick="toggleDictado()">🎤 Dictar por Voz</button>
        <button type="button" class="btn-primary" id="btnGenerar" onclick="generarInforme()">✨ Redactar Informe</button>
      </div>
    </div>

    <div class="card">
      <h2>2. Informe Técnico Redactado (Editable)</h2>
      <div class="output-box" id="resultadoInforme" contenteditable="true">Guardá tu API Key arriba, completá los datos a la izquierda y presioná "Redactar Informe"...</div>
      <div class="btn-group">
        <button type="button" class="btn-copy" onclick="copiarInforme()">📋 Copiar Informe Listo</button>
      </div>
    </div>
  </div>
</div>

<script>
  window.onload = () => {
    const savedKey = localStorage.getItem('gemini_api_key_caba');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('apiStatus').textContent = '✓ Clave lista';
    }
  };

  function guardarApiKey() {
    const key = document.getElementById('apiKeyInput').value.trim();
    if (!key) {
      alert('Ingresá una API Key válida.');
      return;
    }
    localStorage.setItem('gemini_api_key_caba', key);
    document.getElementById('apiStatus').textContent = '✓ Clave guardada';
  }

  let recognition;
  let grabando = false;

  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'es-AR';
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onresult = (event) => {
      const texto = event.results[event.results.length - 1][0].transcript;
      const area = document.getElementById('datosCrudos');
      area.value += (area.value ? ' ' : '') + texto;
    };

    recognition.onend = () => {
      grabando = false;
      const btn = document.getElementById('btnVoz');
      btn.classList.remove('recording');
      btn.textContent = '🎤 Dictar por Voz';
    };
  }

  function toggleDictado() {
    if (!recognition) {
      alert('Tu navegador no soporta dictado por voz. Probá con Chrome o Edge.');
      return;
    }
    const btn = document.getElementById('btnVoz');
    if (!grabando) {
      recognition.start();
      grabando = true;
      btn.classList.add('recording');
      btn.textContent = '⏹ Detener Dictado';
    } else {
      recognition.stop();
    }
  }

  const SYSTEM_PROMPT = `Actúa como un Perito Oficial en Accidentología Vial de la Policía de la Ciudad Autónoma de Buenos Aires (CABA), desempeñándote como asistente técnico-redactor judicial. Transforma los datos crudos relevados en el lugar del hecho en un Informe Técnico Pericial formal, riguroso y listo para su elevación judicial.

DATOS INSTITUCIONALES FIJOS:
- Jurisdicción: Gobierno de la Ciudad Autónoma de Buenos Aires - Ministerio de Seguridad.
- Lema Año 2026: "2026 - Año del 30º Aniversario de la sanción de la Constitución de la Ciudad Autónoma de Buenos Aires."
- Destinatario: AL SEÑOR JEFE DE SECCIÓN INVESTIGACIÓN CIENTÍFICA VIAL. S......................./.......................D.
- Perito Actuante: Oficial Mayor, Legajo N° 11500, Lionel Nicolás ZURITA, Técnico Superior en Criminalística con especialización en Accidentología Vial, numerario de la Sección Investigación Científica Vial, dependiente de la División Ingeniería Vial, Superintendencia de Policía Científica POLICÍA DE LA CIUDAD DE BUENOS AIRES.
- Firma al pie:
OFL Mayor LIONEL ZURITA LP 11500
Técnico Superior en Criminalística - Especialista en Accidentología Vial
POLICÍA DE LA CIUDAD DE BUENOS AIRES

REGLAS METODOLÓGICAS Y TERMINOLOGÍA TÉCNICA:
1. Perspectiva de Ubicación Analítica: Toda descripción de daños sobre los vehículos debe consignarse estrictamente desde la posición del conductor (de atrás hacia adelante y de izquierda a derecha).
2. Direccionalidad de Fuerzas: Especificar siempre el sentido de acción de las fuerzas deformantes (ej. "de adelante hacia atrás", "de atrás hacia adelante", "de izquierda a derecha").
3. Precisión Terminológica: Emplear lenguaje técnico-criminalístico (ej. deformación plástica por compresión, roces abrasivos por contacto contra cuerpo duro, barrido y limpieza de suciedad/polvillo ambiental, transferencia de materia, despliegue de sistemas suplementarios de sujeción / airbags, escena removida posimpacto).
4. Sistemas de Seguridad: Evaluar y dejar constancia estática del estado funcional de los sistemas de seguridad activa y pasiva (frenos, dirección, iluminación, neumáticos, airbags). Si falta la llave de ignición, dejar asentado que los sistemas electromecánicos e instrumentales no pudieron ser verificados por dicho motivo.
5. Objetividad Pericial: En la sección Conclusión, establecer únicamente la compatibilidad físico-mecánica entre los daños, vestigios y la dinámica general del evento, sin atribuir culpabilidades legales ni roles de embestidor/embestido (lo cual se deriva a la División Ingeniería Vial: ingenieriavialcaba@gmail.com, Av. Ramón Castillo 1720, 9° piso, CABA).
6. Corrección de Entrada: Corregir errores de dictado por voz en marcas, modelos y arterias de CABA manteniendo intactos los datos fácticos. Si falta algún dato administrativo, colocar [Completar].

ESTRUCTURA OBLIGATORIA DEL INFORME (en texto plano limpio, sin asteriscos ni símbolos Markdown):
- Membrete Institucional, Fecha en CABA y Título: INFORME TÉCNICO N° [XXXX]/2026.
- Destinatario y Párrafo Introductorio completo.
- OBJETOS DE LA INSPECCIÓN
- ELEMENTOS OFRECIDOS PARA ESTUDIO
- DILIGENCIAS PRACTICADAS (incluyendo Inspección Ocular del Escenario e Infraestructura Vial, Relevamiento de Rastros y Vestigios en la Traza, Posición Final y Examen Técnico Analítico de las Unidades).
- PLANTILLA FOTOGRÁFICA (Espacio reservado para el montaje de las placas fotográficas documentales).
- CONCLUSIÓN (Compatibilidad física + párrafo estándar de remisión sugerida a División Ingeniería Vial + Firma oficial).

Emite directamente el texto completo del informe sin saludos ni comentarios adicionales.`;

  async function generarInforme() {
    const apiKey = document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('gemini_api_key_caba');
    if (!apiKey) {
      alert('Pegá tu API Key de Google AI Studio en la barra superior.');
      return;
    }

    if (!document.getElementById('datosCrudos').value.trim()) {
      alert('Cargá o dictá los datos del relevamiento antes de redactar.');
      return;
    }

    const modelo = document.getElementById('modeloSelect').value;
    const hoy = new Date();
    const meses = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
    const fechaHoy = `${hoy.getDate()} de ${meses[hoy.getMonth()]} del ${hoy.getFullYear()}`;

    const datosUsuario = `
Fecha actual: ${fechaHoy}
N° Informe Técnico: ${document.getElementById('numInforme').value || '[Completar]'}
Sumario: ${document.getElementById('sumario').value || 'N/A'}
Comisaría Vecinal: ${document.getElementById('comisaria').value || '[Completar]'}
Fiscalía: ${document.getElementById('fiscalia').value}
Carátula: ${document.getElementById('caratula').value || 'LESIONES 94 CPN'}
Hora de arribo: ${document.getElementById('horaArribo').value || '[Completar]'}
Lugar del hecho y Efectivo de consigna: ${document.getElementById('lugarConsigna').value || '[Completar]'}
Relato técnico crudo: ${document.getElementById('datosCrudos').value}
    `.trim();

    const btn = document.getElementById('btnGenerar');
    const output = document.getElementById('resultadoInforme');
    btn.disabled = true;
    btn.textContent = '⏳ Redactando...';
    output.textContent = `Enviando datos a ${modelo}...`;

    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelo}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents: [{ parts: [{ text: datosUsuario }] }],
          generationConfig: { temperature: 0.2 }
        })
      });

      const data = await response.json();

      if (!response.ok || data.error) {
        throw new Error(`[HTTP ${response.status}] ${data.error?.message || JSON.stringify(data)}`);
      }

      const texto = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!texto) {
        throw new Error('Respuesta vacía del servidor.');
      }

      output.textContent = texto;

    } catch (error) {
      output.textContent = `DIAGNÓSTICO DE CONEXIÓN:\n${error.message}\n\nSugerencia: Si el error dice "not found" o "not supported", cambiá el selector de modelo arriba a la derecha (probá con gemini-3-flash-preview o gemini-2.5-flash) y volvé a tocar Redactar.`;
    } finally {
      btn.disabled = false;
      btn.textContent = '✨ Redactar Informe';
    }
  }

  function copiarInforme() {
    const texto = document.getElementById('resultadoInforme').innerText;
    navigator.clipboard.writeText(texto);
    alert('Informe copiado al portapapeles.');
  }
</script>

</body>
</html>
